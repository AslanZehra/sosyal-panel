{% extends "layout.html" %}
{% block content %}

<section class="form-card auth-shell">
  <h1 class="page-title" data-i18n="auth_reset_title">Yeni Şifre Belirle</h1>
  <p class="page-desc" data-i18n="auth_reset_desc">Yeni şifreni gir ve hesabına yeniden erişim kazan.</p>

  {% if token_error %}
    <p class="small" style="margin:8px 0 12px 0;">
      <span class="badge danger">{{ token_error }}</span>
    </p>
    <div class="form-actions" style="justify-content:flex-start;">
      <a class="btn" href="{{ url_for('forgot_password') }}" data-i18n="auth_forgot_password">Şifremi Unuttum</a>
      <a class="btn primary-btn" href="{{ url_for('login') }}" data-i18n="auth_back_login">Girişe Dön</a>
    </div>
  {% else %}
    {% if form_error %}
      <p class="small" style="margin:8px 0 12px 0;">
        <span class="badge danger">{{ form_error }}</span>
      </p>
    {% endif %}

    <form method="post">
      <div class="form-row">
        <label class="form-label" for="password" data-i18n="auth_password">Şifre</label>
        <input id="password" name="password" type="password" class="input" minlength="6" required>
      </div>

      <div class="form-row">
        <label class="form-label" for="password2" data-i18n="auth_password_repeat">Şifre (tekrar)</label>
        <input id="password2" name="password2" type="password" class="input" minlength="6" required>
      </div>

      <div class="form-actions">
        <a class="btn" href="{{ url_for('login') }}" data-i18n="auth_back_login">Girişe Dön</a>
        <button type="submit" class="btn primary-btn" data-i18n="auth_reset_submit">Şifreyi Güncelle</button>
      </div>
    </form>
  {% endif %}
</section>

{% endblock %}
