<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MySocial Panel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-title" data-i18n="app_title">MySocial Panel</span>
      </div>

      <nav class="nav">
        <a href="{{ url_for('home') }}" class="{% if request.path == '/' %}active{% endif %}" data-i18n="nav_home">Ana Sayfa</a>
        <a href="{{ url_for('prepare') }}" class="{% if request.path in ['/create','/prepare'] %}active{% endif %}" data-i18n="nav_create">Gönderi Oluştur</a>
        <a href="{{ url_for('tasks') }}" class="{% if request.path == '/tasks' %}active{% endif %}" data-i18n="nav_scheduled">Zamanlanmış</a>
        <a href="{{ url_for('queue_view') }}" class="{% if request.path == '/queue' %}active{% endif %}" data-i18n="nav_queue">Kuyruk</a>
        <a href="{{ url_for('worker_logs_view') }}" class="{% if request.path == '/worker-logs' %}active{% endif %}" data-i18n="nav_worker_logs">Worker Log</a>
        <a href="{{ url_for('archive_view') }}" class="{% if request.path == '/archive' %}active{% endif %}" data-i18n="nav_archive">Arşiv</a>
        <a href="{{ url_for('drafts') }}" class="{% if request.path == '/drafts' %}active{% endif %}" data-i18n="nav_drafts">Taslaklar</a>
        <a href="{{ url_for('accounts') }}" class="{% if request.path == '/accounts' %}active{% endif %}" data-i18n="nav_accounts">Hesaplar</a>
      </nav>

      <div class="topbar-right">
        <select class="select" id="lang-select" aria-label="Language">
          <option value="tr">TR</option>
          <option value="en">EN</option>
          <option value="ar">AR</option>
          <option value="fa">FA</option>
          <option value="fr">FR</option>
          <option value="ja">JA</option>
        </select>
      </div>
    </div>
  </div>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script src="{{ url_for('static', filename='translations.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
