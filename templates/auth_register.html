{% extends "layout.html" %}
{% block content %}
<section class="card auth-card">
    <h2>Kayıt ol</h2>
    <p class="auth-sub">Kendi Visart hesabını oluştur, gönderilerin sana özel olsun.</p>

    <form method="POST" class="form">
        <label for="email">E-posta</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" minlength="6" required>

        <label for="password2">Şifre (tekrar)</label>
        <input id="password2" name="password2" type="password" minlength="6" required>

        <button type="submit" class="btn primary full">Kayıt ol</button>

        <p class="auth-foot">
            Zaten hesabın var mı?
            <a href="{{ url_for('login') }}">Giriş yap</a>
        </p>
    </form>
</section>
{% endblock %}
