{% extends "layout.html" %}
{% block content %}

<section class="form-card auth-shell">
  <h1 class="page-title" data-i18n="auth_register_title">Kayıt Ol</h1>
  <p class="page-desc" data-i18n="auth_register_desc">Her kullanıcı kendi kuyruk, arşiv ve hesap bağlantılarıyla ayrı çalışır.</p>

  {% if form_error %}
    <p class="small" style="margin:8px 0 12px 0;">
      <span class="badge danger">{{ form_error }}</span>
    </p>
  {% endif %}

  <form method="post">
    <div class="form-row">
      <label class="form-label" for="email" data-i18n="auth_email">E-posta</label>
      <input id="email" name="email" type="email" class="input" required>
    </div>

    <div class="form-row">
      <label class="form-label" for="password" data-i18n="auth_password">Şifre</label>
      <input id="password" name="password" type="password" class="input" minlength="6" required>
    </div>

    <div class="form-row">
      <label class="form-label" for="password2" data-i18n="auth_password_repeat">Şifre (tekrar)</label>
      <input id="password2" name="password2" type="password" class="input" minlength="6" required>
    </div>

    <div class="form-actions">
      <a class="btn" href="{{ url_for('login') }}" data-i18n="nav_login">Giriş Yap</a>
      <button type="submit" class="btn primary-btn" data-i18n="nav_register">Kayıt Ol</button>
    </div>
  </form>
</section>

{% endblock %}
