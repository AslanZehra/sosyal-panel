{% extends "layout.html" %}
{% block content %}

<section class="form-card auth-shell">
  <h1 class="page-title">Giriş Yap</h1>
  <p class="page-desc">Panel artık kullanıcı oturumuyla çalışır. Giriş yaptıktan sonra sadece kendi verini görürsün.</p>

  {% if form_error %}
    <p class="small" style="margin:8px 0 12px 0;">
      <span class="badge danger">{{ form_error }}</span>
    </p>
  {% endif %}

  <form method="post">
    <div class="form-row">
      <label class="form-label" for="email">E-posta</label>
      <input id="email" name="email" type="email" class="input" required>
    </div>

    <div class="form-row">
      <label class="form-label" for="password">Şifre</label>
      <input id="password" name="password" type="password" class="input" required>
    </div>

    <div class="form-actions">
      <a class="btn" href="{{ url_for('register') }}">Kayıt Ol</a>
      <button type="submit" class="btn primary-btn">Giriş Yap</button>
    </div>
  </form>
</section>

{% endblock %}
